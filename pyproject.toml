# Packaging follows Dynamo v1.4.2; engine distributions are supplied by the vendor.
[project]
name = "ai-dynamo"
version = "1.4.2"
description = "NanHuInfer components derived from Dynamo"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "ai-dynamo-runtime==1.4.2",
    "aiohttp>=3.14.3,<4.0",
    "transformers>=4.56.0",
    "kubernetes>=32.0.1,<33.0.0",
    "prometheus-client>=0.23.1,<1.0",
    "msgspec>=0.19.0",
    "zstandard>=0.23.0,<1.0",
    "pyzmq>=26.0.0",
    "typing-extensions>=4.10.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["components/src/dynamo"]

[tool.hatch.build.targets.sdist]
include = ["components/src/dynamo", "pyproject.toml", "README.md", "LICENSE"]
