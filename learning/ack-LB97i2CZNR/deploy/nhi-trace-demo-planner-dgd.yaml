#
# nhi/dynamo-trace-demo-planner —— dynamo-trace-demo-mixed 的全量副本 + Planner 组件（advisory 模式）。
#
# 为什么又是新建 DGD 而不是往 mixed 里加 Planner：
#   Operator 准入 webhook 按「组件名集合」做差集校验，added/removed 任一非空即拒绝
#   （deploy/operator/internal/webhook/validation/dynamographdeployment.go），拓扑不可原地扩展。
#   因此沿用 mixed 上线时的「先建新、验证通过、再切 NodePort selector、最后删旧」零中断流程。
#
# Planner 组件要点：
#   - 镜像 harbor.zhejianglab.com/zjnc-tech/dynamo-planner:1.4.1（官方发布版的之江镜像仓副本，
#     与 runtime 1.4.1 同版本）：集群节点直达该仓库（内网 DNS 解析 10.101.88.105，registry v2 返 401
#     = 可达需鉴权），无需搬运到 10.200.88.53；拉取凭据 nhi/zjnc-harbor-secret。
#     背景：曾用 Harbor nhss/dynamo-planner:1.0 验证，实测为南桦 igd 体系改件（K8s connector
#     查 infergraphdeployments.nanhu-tech.io CRD，403 实锤），与官方 operator DGD 体系不通，已弃用。
#     runtime 镜像（1.4.1）不带 planner 依赖（dynamo.planner / kubernetes_asyncio /
#     pmdarima / prophet / aiconfigurator 全 MISS），故必须用 planner 专用镜像。
#     PlannerConfig 为 extra="forbid"，字段不识别会在启动时直接崩溃；观察期（未切 selector
#     前）崩溃无害，出指标即为兼容。
#   - advisory: true —— 只计算/上报 dynamo_planner_* 指标，不执行扩缩容（用户拍板）。
#   - mode: disagg —— planner 的 scaling 单元只有 agg 或 disagg 两种，mixed 拓扑不能同时纳管；
#     这里选 disagg 纳管 prefill/decode 支路。
#   - metrics 端口 9085（operator 自动注入 PLANNER_PROMETHEUS_PORT 并挂 ServiceAccount
#     planner-serviceaccount，RBAC 已由 platform chart 就位）。
#   - command 用 python3（官方 planner 镜像基于 nvcr.io/nvidia/distroless/python:3.13，
#     无 /opt/dynamo/venv 路径；与 examples/backends/sglang/deploy/disagg_planner.yaml 一致）。
#
# 30000 入口交接：NodePort Service 的 selector 需从 dynamo-trace-demo-mixed 指向本 DGD，
#   见 nhi-frontend-nodeport.yaml 说明。
#
# PD 配对边界：prefill 与 decode 的 --namespace 必须同为 ...-planner-pd，
#   不一致时 pod 全 Ready、DGD READY=True，但请求返回 503 "not ready"。
#
# 生成方式：由仓库源码 nhi-trace-demo-mixed-dgd.yaml（已验证与 live spec 逐字节一致）
#   全局改名 dynamo-trace-demo-mixed → dynamo-trace-demo-planner 而来，四组件配置零改动。
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: dynamo-trace-demo-planner
  namespace: nhi
  labels:
    app.kubernetes.io/name: dynamo-trace-demo-planner
    app.kubernetes.io/part-of: dynamo-tracing
spec:
  components:
  - name: Frontend
    podTemplate:
      metadata:
        labels:
          app.kubernetes.io/component: frontend
          app.kubernetes.io/name: dynamo-trace-demo-planner
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: dros.zjlab.io/clusterEnv
                  operator: In
                  values:
                  - drosInCluster
                - key: dros.zjlab.io/spec
                  operator: In
                  values:
                  - GPU_Z2280_24GB
                - key: dros.zjlab.io/resourcepool
                  operator: DoesNotExist
                - key: dros.zjlab.io/reserve
                  operator: DoesNotExist
                - key: dros.zjlab.io/nodegroup
                  operator: DoesNotExist
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: frontend
                    app.kubernetes.io/name: dynamo-trace-demo-planner
                topologyKey: kubernetes.io/hostname
              weight: 100
        containers:
        - env:
          - name: DYN_ROUTER_MODE
            value: kv
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: DYN_EVENT_PLANE
            value: zmq
          - name: DYN_HTTP_BODY_LIMIT_MB
            value: '200'
          - name: OTEL_EXPORT_ENABLED
            value: 'true'
          - name: OTEL_EXPORTER_OTLP_PROTOCOL
            value: grpc
          - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
            value: http://otel-collector.nhi.svc.cluster.local:4317
          - name: OTEL_SERVICE_NAME
            value: dynamo-trace-demo-planner-frontend
          - name: OTEL_TRACES_SAMPLE_RATIO
            value: '1.0'
          image: 10.200.88.53/nhss/dynamo-sglang-runtime:1.4.1-amd64
          name: main
          resources:
            limits:
              memory: 32Gi
            requests:
              cpu: '4'
              memory: 8Gi
          volumeMounts:
          - mountPath: /mnt/nfs-models/default
            name: model-storage
            readOnly: true
            subPath: default
        imagePullSecrets:
        - name: docker-registry-secret
        terminationGracePeriodSeconds: 60
        tolerations:
        - effect: NoSchedule
          key: node-role.alibabacloud.com/bmcp
          operator: Exists
        volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: nhi-dynamo-trace-models-pvc
    replicas: 1
    type: frontend
  - name: aggregated
    podTemplate:
      metadata:
        labels:
          app.kubernetes.io/component: worker
          app.kubernetes.io/name: dynamo-trace-demo-planner
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: dros.zjlab.io/clusterEnv
                  operator: In
                  values:
                  - drosInCluster
                - key: dros.zjlab.io/spec
                  operator: In
                  values:
                  - GPU_Z2280_24GB
                - key: dros.zjlab.io/resourcepool
                  operator: DoesNotExist
                - key: dros.zjlab.io/reserve
                  operator: DoesNotExist
                - key: dros.zjlab.io/nodegroup
                  operator: DoesNotExist
        containers:
        - args:
          - --model-path
          - /mnt/nfs-models/default/Qwen3.8-27B
          - --served-model-name
          - Qwen3.8-27B
          - --enable-multimodal
          - --context-length
          - '262144'
          - --page-size
          - '1'
          - --tp
          - '4'
          - --trust-remote-code
          - --chunked-prefill-size
          - '2048'
          - --mem-fraction-static
          - '0.90'
          - --mamba-radix-cache-strategy
          - extra_buffer_lazy
          - --dyn-tool-call-parser
          - qwen3_coder
          - --dyn-reasoning-parser
          - qwen3
          - --host
          - 0.0.0.0
          - --enable-metrics
          - --disable-piecewise-cuda-graph
          - --kv-events-config
          - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5557"}'
          - --namespace
          - nhi-dynamo-trace-demo-planner-agg
          - --enable-trace
          - --otlp-traces-endpoint
          - otel-collector.nhi.svc.cluster.local:4317
          - --sglang-trace-level
          - '2'
          command:
          - python3
          - -m
          - dynamo.sglang
          env:
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: DYN_EVENT_PLANE
            value: zmq
          - name: DYN_WORKER_GRACEFUL_SHUTDOWN_TIMEOUT
            value: '300'
          - name: NCCL_DEBUG
            value: WARN
          - name: OTEL_EXPORT_ENABLED
            value: 'true'
          - name: OTEL_EXPORTER_OTLP_PROTOCOL
            value: grpc
          - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
            value: http://otel-collector.nhi.svc.cluster.local:4317
          - name: OTEL_SERVICE_NAME
            value: dynamo-trace-demo-planner-aggregated
          - name: OTEL_TRACES_SAMPLE_RATIO
            value: '1.0'
          image: 10.200.88.53/nhss/dynamo-sglang-runtime:1.4.1-amd64
          name: main
          resources:
            limits:
              memory: 256Gi
              nvidia.com/gpu: '4'
            requests:
              cpu: '32'
              ephemeral-storage: 8Gi
              memory: 128Gi
              nvidia.com/gpu: '4'
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RESOURCE
          volumeMounts:
          - mountPath: /mnt/nfs-models/default
            name: model-storage
            readOnly: true
            subPath: default
          - mountPath: /dev/shm
            name: dshm
          workingDir: /workspace/examples/backends/sglang
        imagePullSecrets:
        - name: docker-registry-secret
        terminationGracePeriodSeconds: 300
        tolerations:
        - effect: NoSchedule
          key: node-role.alibabacloud.com/bmcp
          operator: Exists
        volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: nhi-dynamo-trace-models-pvc
        - emptyDir:
            medium: Memory
            sizeLimit: 64Gi
          name: dshm
    replicas: 1
    type: worker
  - name: prefill
    podTemplate:
      metadata:
        labels:
          app.kubernetes.io/component: prefill
          app.kubernetes.io/name: dynamo-trace-demo-planner
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: dros.zjlab.io/clusterEnv
                  operator: In
                  values:
                  - drosInCluster
                - key: dros.zjlab.io/spec
                  operator: In
                  values:
                  - GPU_Z2280_24GB
                - key: dros.zjlab.io/resourcepool
                  operator: DoesNotExist
                - key: dros.zjlab.io/reserve
                  operator: DoesNotExist
                - key: dros.zjlab.io/nodegroup
                  operator: DoesNotExist
        containers:
        - args:
          - --model-path
          - /mnt/nfs-models/default/Qwen/Qwen2.5-7B-Instruct
          - --served-model-name
          - Qwen2.5-7B-Instruct
          - --context-length
          - '32768'
          - --page-size
          - '1'
          - --tp
          - '1'
          - --trust-remote-code
          - --chunked-prefill-size
          - '2048'
          - --mem-fraction-static
          - '0.85'
          - --host
          - 0.0.0.0
          - --enable-metrics
          - --kv-events-config
          - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5557"}'
          - --disaggregation-mode
          - prefill
          - --disaggregation-transfer-backend
          - mooncake_tcp
          - --disaggregation-bootstrap-port
          - '8998'
          - --enable-trace
          - --otlp-traces-endpoint
          - otel-collector.nhi.svc.cluster.local:4317
          - --sglang-trace-level
          - '2'
          - --namespace
          - nhi-dynamo-trace-demo-planner-pd
          command:
          - python3
          - -m
          - dynamo.sglang
          env:
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: DYN_EVENT_PLANE
            value: zmq
          - name: DYN_WORKER_GRACEFUL_SHUTDOWN_TIMEOUT
            value: '300'
          - name: NCCL_DEBUG
            value: WARN
          - name: OTEL_EXPORT_ENABLED
            value: 'true'
          - name: OTEL_EXPORTER_OTLP_PROTOCOL
            value: grpc
          - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
            value: http://otel-collector.nhi.svc.cluster.local:4317
          - name: OTEL_SERVICE_NAME
            value: dynamo-trace-demo-planner-prefill
          - name: OTEL_TRACES_SAMPLE_RATIO
            value: '1.0'
          image: 10.200.88.53/nhss/dynamo-sglang-runtime:1.4.1-amd64
          name: main
          resources:
            limits:
              memory: 64Gi
              nvidia.com/gpu: '1'
            requests:
              cpu: '8'
              ephemeral-storage: 8Gi
              memory: 32Gi
              nvidia.com/gpu: '1'
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RESOURCE
          volumeMounts:
          - mountPath: /mnt/nfs-models/default
            name: model-storage
            readOnly: true
            subPath: default
          - mountPath: /dev/shm
            name: dshm
          workingDir: /workspace/examples/backends/sglang
        imagePullSecrets:
        - name: docker-registry-secret
        terminationGracePeriodSeconds: 300
        tolerations:
        - effect: NoSchedule
          key: node-role.alibabacloud.com/bmcp
          operator: Exists
        volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: nhi-dynamo-trace-models-pvc
        - emptyDir:
            medium: Memory
            sizeLimit: 64Gi
          name: dshm
    replicas: 1
    type: prefill
  - name: decode
    podTemplate:
      metadata:
        labels:
          app.kubernetes.io/component: decode
          app.kubernetes.io/name: dynamo-trace-demo-planner
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: dros.zjlab.io/clusterEnv
                  operator: In
                  values:
                  - drosInCluster
                - key: dros.zjlab.io/spec
                  operator: In
                  values:
                  - GPU_Z2280_24GB
                - key: dros.zjlab.io/resourcepool
                  operator: DoesNotExist
                - key: dros.zjlab.io/reserve
                  operator: DoesNotExist
                - key: dros.zjlab.io/nodegroup
                  operator: DoesNotExist
        containers:
        - args:
          - --model-path
          - /mnt/nfs-models/default/Qwen/Qwen2.5-7B-Instruct
          - --served-model-name
          - Qwen2.5-7B-Instruct
          - --context-length
          - '32768'
          - --page-size
          - '1'
          - --tp
          - '1'
          - --trust-remote-code
          - --chunked-prefill-size
          - '2048'
          - --mem-fraction-static
          - '0.85'
          - --host
          - 0.0.0.0
          - --enable-metrics
          - --kv-events-config
          - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5557"}'
          - --disaggregation-mode
          - decode
          - --disaggregation-transfer-backend
          - mooncake_tcp
          - --enable-trace
          - --otlp-traces-endpoint
          - otel-collector.nhi.svc.cluster.local:4317
          - --sglang-trace-level
          - '2'
          - --namespace
          - nhi-dynamo-trace-demo-planner-pd
          command:
          - python3
          - -m
          - dynamo.sglang
          env:
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: DYN_EVENT_PLANE
            value: zmq
          - name: DYN_WORKER_GRACEFUL_SHUTDOWN_TIMEOUT
            value: '300'
          - name: NCCL_DEBUG
            value: WARN
          - name: OTEL_EXPORT_ENABLED
            value: 'true'
          - name: OTEL_EXPORTER_OTLP_PROTOCOL
            value: grpc
          - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
            value: http://otel-collector.nhi.svc.cluster.local:4317
          - name: OTEL_SERVICE_NAME
            value: dynamo-trace-demo-planner-decode
          - name: OTEL_TRACES_SAMPLE_RATIO
            value: '1.0'
          image: 10.200.88.53/nhss/dynamo-sglang-runtime:1.4.1-amd64
          name: main
          resources:
            limits:
              memory: 64Gi
              nvidia.com/gpu: '1'
            requests:
              cpu: '8'
              ephemeral-storage: 8Gi
              memory: 32Gi
              nvidia.com/gpu: '1'
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RESOURCE
          volumeMounts:
          - mountPath: /mnt/nfs-models/default
            name: model-storage
            readOnly: true
            subPath: default
          - mountPath: /dev/shm
            name: dshm
          workingDir: /workspace/examples/backends/sglang
        imagePullSecrets:
        - name: docker-registry-secret
        terminationGracePeriodSeconds: 300
        tolerations:
        - effect: NoSchedule
          key: node-role.alibabacloud.com/bmcp
          operator: Exists
        volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: nhi-dynamo-trace-models-pvc
        - emptyDir:
            medium: Memory
            sizeLimit: 64Gi
          name: dshm
    replicas: 1
    type: decode
  - name: Planner
    podTemplate:
      metadata:
        labels:
          app.kubernetes.io/component: planner
          app.kubernetes.io/name: dynamo-trace-demo-planner
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: dros.zjlab.io/clusterEnv
                  operator: In
                  values:
                  - drosInCluster
                - key: dros.zjlab.io/spec
                  operator: In
                  values:
                  - GPU_Z2280_24GB
                - key: dros.zjlab.io/resourcepool
                  operator: DoesNotExist
                - key: dros.zjlab.io/reserve
                  operator: DoesNotExist
                - key: dros.zjlab.io/nodegroup
                  operator: DoesNotExist
        containers:
        - name: main
          image: harbor.zhejianglab.com/zjnc-tech/dynamo-planner:1.4.1
          command:
          - python3
          - -m
          - dynamo.planner
          args:
          - --config
          - '{"environment": "kubernetes", "backend": "sglang", "mode": "disagg", "advisory": true, "pre_deployment_sweeping_mode": "none"}'
          env:
          - name: PROMETHEUS_ENDPOINT
            value: http://prometheus-server.prometheus.svc.cluster.local:80
          resources:
            limits:
              memory: 4Gi
            requests:
              cpu: '1'
              memory: 2Gi
        imagePullSecrets:
        - name: docker-registry-secret
        - name: zjnc-harbor-secret
        terminationGracePeriodSeconds: 60
        tolerations:
        - effect: NoSchedule
          key: node-role.alibabacloud.com/bmcp
          operator: Exists
    replicas: 1
    type: planner
