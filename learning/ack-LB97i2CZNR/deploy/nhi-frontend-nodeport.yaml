#
# 跨集群访问用的 NodePort 暴露：
#   maas-dev 集群 -> ack-LB 集群，实测仅 2049 / 9990 / 30000 三个端口被 ACL 放通。
#   30000 是本项目预先申请并预留的端口，专用于 litellm 网关访问 trace demo frontend。
#
# 为什么是独立的 Service 而不是写进 DGD：
#   本 DGD 使用 v1beta1，其 spec 只有 components/podTemplate，没有 services 字段；
#   只有 v1alpha1 的 spec.services 才能声明 Service 类型与 nodePort。降级 CRD 版本
#   需要重写整个 DGD 结构且 Operator 行为不同，代价远大于一条独立 Service。
#   故 30000 的绑定由此文件单独声明式管理，dynamo 运行时不需改动或重启。
#
# selector 指向哪个 DGD（2026-11-02 起）：
#   DGD 组件拓扑创建后不可增删（operator 准入 webhook 按组件名集合做差集校验），
#   所以 PD 无法并入本 DGD，改为新建承载完整拓扑的 dynamo-trace-demo-mixed，
#   再把此 Service 的 selector 从 nhi-dynamo-trace-demo 换到 nhi-dynamo-trace-demo-mixed。
#   顺序是「先建新 DGD 并验证就绪，再切 selector」，30000 全程没有中断。
#   selector 三个 label 都是 DGD 身份级（不含 pod-template-hash），推理滚动更新不会失配。
#
# Service 端口与 Frontend 容器端口对齐（2026-11-06 起）：
#   mixed DGD 已把 Frontend 的 DYN_HTTP_PORT 从 operator 默认的 8000 覆盖到 9990，
#   故这里 Service.port 同步从 8000 改成 9990，避免 Service 端口与实际容器端口不一致。
#   targetPort 仍走命名端口 http（解析到 containerPort 9990），无需改动。
#   跨集群入口 nodePort 30000 由 ACL 预留，不变。
#
# 回退：
#   服务回退 —— 把 selector 的 nvidia.com/dynamo-namespace 改回 nhi-dynamo-trace-demo，
#     并重新 apply deploy/nhi-dgd.json（该 DGD 若已删除需先建回）。
#   整体删除：kubectl -n nhi delete svc dynamo-trace-demo-frontend-nodeport
---
apiVersion: v1
kind: Service
metadata:
  name: dynamo-trace-demo-frontend-nodeport
  namespace: nhi
  labels:
    app.kubernetes.io/name: dynamo-trace-demo-mixed
    app.kubernetes.io/part-of: dynamo-tracing
    purpose: cross-cluster-access
spec:
  type: NodePort
  selector:
    nvidia.com/dynamo-component: Frontend
    nvidia.com/dynamo-component-type: frontend
    nvidia.com/dynamo-namespace: nhi-dynamo-trace-demo-mixed
  ports:
    - name: http
      port: 9990
      targetPort: http
      nodePort: 30000
      protocol: TCP
