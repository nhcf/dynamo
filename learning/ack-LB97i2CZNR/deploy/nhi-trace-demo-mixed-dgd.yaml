#
# nhi/dynamo-trace-demo-mixed —— 一个 Frontend 同时服务 aggregated 与 PD 两条路径。
#
# 为什么要新建 DGD 而不是往 dynamo-trace-demo 里加组件：
#   Operator 准入 webhook 按「组件名集合」做差集校验，added/removed 任一非空即拒绝
#   （deploy/operator/internal/webhook/validation/dynamographdeployment.go），
#   重命名组件等同一增一删，同样禁止；只有 reorder 允许。故拓扑不可原地扩展，
#   复用同一 Frontend 的唯一路径是新建一个组件集合天生完整的 DGD。
#   跨 DGD 共享 Frontend 也不可行：Operator 按 DGD 名注入 DYN_NAMESPACE/DYN_NAMESPACE_PREFIX，
#   DYN_DISCOVERY_BACKEND=kubernetes 下服务发现按 pod label nvidia.com/dynamo-namespace 过滤。
#
# PD 配对边界：prefill 与 decode 的 --namespace 必须同为 ...-mixed-pd，
#   不一致时 pod 全 Ready、DGD READY=True，但请求返回 503 "not ready"。
#
# 30000 入口交接：NodePort Service 的 selector 已从 dynamo-trace-demo 指向本 DGD，
#   见 nhi-frontend-nodeport.yaml 说明。切换采用「先建新、验证通过、再改 selector」，
#   因此对已有链路零中断。
#
# 生成方式：由 live dynamo-trace-demo + dynamo-trace-pd 的 podTemplate deepcopy 合成，
#   已剔除 nvidia.com/* 状态 annotation，并同步改写 podAntiAffinity 内的 labelSelector。
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: dynamo-trace-demo-mixed
  namespace: nhi
  labels:
    app.kubernetes.io/name: dynamo-trace-demo-mixed
    app.kubernetes.io/part-of: dynamo-tracing
spec:
  components:
  - name: Frontend
    podTemplate:
      metadata:
        labels:
          app.kubernetes.io/component: frontend
          app.kubernetes.io/name: dynamo-trace-demo-mixed
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: dros.zjlab.io/clusterEnv
                  operator: In
                  values:
                  - drosInCluster
                - key: dros.zjlab.io/spec
                  operator: In
                  values:
                  - GPU_Z2280_24GB
                - key: dros.zjlab.io/resourcepool
                  operator: DoesNotExist
                - key: dros.zjlab.io/reserve
                  operator: DoesNotExist
                - key: dros.zjlab.io/nodegroup
                  operator: DoesNotExist
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: frontend
                    app.kubernetes.io/name: dynamo-trace-demo-mixed
                topologyKey: kubernetes.io/hostname
              weight: 100
        containers:
        - env:
          - name: DYN_ROUTER_MODE
            value: kv
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: DYN_EVENT_PLANE
            value: zmq
          - name: DYN_HTTP_BODY_LIMIT_MB
            value: '200'
          # 覆盖 operator 默认注入的 DYN_HTTP_PORT=8000（MergeEnvs 以用户 env 为准）
          - name: DYN_HTTP_PORT
            value: '9990'
          - name: DYNAMO_PORT
            value: '9990'
          - name: OTEL_EXPORT_ENABLED
            value: 'true'
          - name: OTEL_EXPORTER_OTLP_PROTOCOL
            value: grpc
          - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
            value: http://otel-collector.nhi.svc.cluster.local:4317
          - name: OTEL_SERVICE_NAME
            value: dynamo-trace-demo-mixed-frontend
          - name: OTEL_TRACES_SAMPLE_RATIO
            value: '1.0'
          image: 10.200.88.53/nhss/dynamo-sglang-runtime:1.4.1-amd64
          name: main
          ports:
          - name: http
            containerPort: 9990
            protocol: TCP
          resources:
            limits:
              memory: 32Gi
            requests:
              cpu: '4'
              memory: 8Gi
          volumeMounts:
          - mountPath: /mnt/nfs-models/default
            name: model-storage
            readOnly: true
            subPath: default
        imagePullSecrets:
        - name: docker-registry-secret
        terminationGracePeriodSeconds: 60
        tolerations:
        - effect: NoSchedule
          key: node-role.alibabacloud.com/bmcp
          operator: Exists
        volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: nhi-dynamo-trace-models-pvc
    replicas: 1
    type: frontend
  - name: aggregated
    podTemplate:
      metadata:
        labels:
          app.kubernetes.io/component: worker
          app.kubernetes.io/name: dynamo-trace-demo-mixed
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: dros.zjlab.io/clusterEnv
                  operator: In
                  values:
                  - drosInCluster
                - key: dros.zjlab.io/spec
                  operator: In
                  values:
                  - GPU_Z2280_24GB
                - key: dros.zjlab.io/resourcepool
                  operator: DoesNotExist
                - key: dros.zjlab.io/reserve
                  operator: DoesNotExist
                - key: dros.zjlab.io/nodegroup
                  operator: DoesNotExist
        containers:
        - args:
          - --model-path
          - /mnt/nfs-models/default/Qwen3.8-27B
          - --served-model-name
          - Qwen3.8-27B
          - --enable-multimodal
          - --context-length
          - '262144'
          - --page-size
          - '1'
          - --tp
          - '4'
          - --trust-remote-code
          - --chunked-prefill-size
          - '2048'
          - --mem-fraction-static
          - '0.90'
          - --mamba-radix-cache-strategy
          - extra_buffer_lazy
          - --dyn-tool-call-parser
          - qwen3_coder
          - --dyn-reasoning-parser
          - qwen3
          - --host
          - 0.0.0.0
          - --enable-metrics
          - --disable-piecewise-cuda-graph
          - --kv-events-config
          - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5557"}'
          - --namespace
          - nhi-dynamo-trace-demo-mixed-agg
          - --enable-trace
          - --otlp-traces-endpoint
          - otel-collector.nhi.svc.cluster.local:4317
          - --sglang-trace-level
          - '2'
          command:
          - python3
          - -m
          - dynamo.sglang
          env:
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: DYN_EVENT_PLANE
            value: zmq
          - name: DYN_WORKER_GRACEFUL_SHUTDOWN_TIMEOUT
            value: '300'
          # 覆盖 operator 默认注入的 DYN_SYSTEM_PORT=9090
          - name: DYN_SYSTEM_PORT
            value: '8000'
          - name: NCCL_DEBUG
            value: WARN
          - name: OTEL_EXPORT_ENABLED
            value: 'true'
          - name: OTEL_EXPORTER_OTLP_PROTOCOL
            value: grpc
          - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
            value: http://otel-collector.nhi.svc.cluster.local:4317
          - name: OTEL_SERVICE_NAME
            value: dynamo-trace-demo-mixed-aggregated
          - name: OTEL_TRACES_SAMPLE_RATIO
            value: '1.0'
          image: 10.200.88.53/nhss/dynamo-sglang-runtime:1.4.1-amd64
          name: main
          ports:
          - name: system
            containerPort: 8000
            protocol: TCP
          resources:
            limits:
              memory: 256Gi
              nvidia.com/gpu: '4'
            requests:
              cpu: '32'
              ephemeral-storage: 8Gi
              memory: 128Gi
              nvidia.com/gpu: '4'
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RESOURCE
          volumeMounts:
          - mountPath: /mnt/nfs-models/default
            name: model-storage
            readOnly: true
            subPath: default
          - mountPath: /dev/shm
            name: dshm
          workingDir: /workspace/examples/backends/sglang
        imagePullSecrets:
        - name: docker-registry-secret
        terminationGracePeriodSeconds: 300
        tolerations:
        - effect: NoSchedule
          key: node-role.alibabacloud.com/bmcp
          operator: Exists
        volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: nhi-dynamo-trace-models-pvc
        - emptyDir:
            medium: Memory
            sizeLimit: 64Gi
          name: dshm
    replicas: 1
    type: worker
  - name: prefill
    podTemplate:
      metadata:
        labels:
          app.kubernetes.io/component: prefill
          app.kubernetes.io/name: dynamo-trace-demo-mixed
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: dros.zjlab.io/clusterEnv
                  operator: In
                  values:
                  - drosInCluster
                - key: dros.zjlab.io/spec
                  operator: In
                  values:
                  - GPU_Z2280_24GB
                - key: dros.zjlab.io/resourcepool
                  operator: DoesNotExist
                - key: dros.zjlab.io/reserve
                  operator: DoesNotExist
                - key: dros.zjlab.io/nodegroup
                  operator: DoesNotExist
        containers:
        - args:
          - --model-path
          - /mnt/nfs-models/default/Qwen/Qwen2.5-7B-Instruct
          - --served-model-name
          - Qwen2.5-7B-Instruct
          - --context-length
          - '32768'
          - --page-size
          - '1'
          - --tp
          - '1'
          - --trust-remote-code
          - --chunked-prefill-size
          - '2048'
          - --mem-fraction-static
          - '0.85'
          - --host
          - 0.0.0.0
          - --enable-metrics
          - --kv-events-config
          - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5557"}'
          - --disaggregation-mode
          - prefill
          - --disaggregation-transfer-backend
          - mooncake_tcp
          - --disaggregation-bootstrap-port
          - '8998'
          - --enable-trace
          - --otlp-traces-endpoint
          - otel-collector.nhi.svc.cluster.local:4317
          - --sglang-trace-level
          - '2'
          - --namespace
          - nhi-dynamo-trace-demo-mixed-pd
          command:
          - python3
          - -m
          - dynamo.sglang
          env:
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: DYN_EVENT_PLANE
            value: zmq
          - name: DYN_WORKER_GRACEFUL_SHUTDOWN_TIMEOUT
            value: '300'
          # 覆盖 operator 默认注入的 DYN_SYSTEM_PORT=9090
          - name: DYN_SYSTEM_PORT
            value: '8000'
          - name: NCCL_DEBUG
            value: WARN
          - name: OTEL_EXPORT_ENABLED
            value: 'true'
          - name: OTEL_EXPORTER_OTLP_PROTOCOL
            value: grpc
          - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
            value: http://otel-collector.nhi.svc.cluster.local:4317
          - name: OTEL_SERVICE_NAME
            value: dynamo-trace-demo-mixed-prefill
          - name: OTEL_TRACES_SAMPLE_RATIO
            value: '1.0'
          image: 10.200.88.53/nhss/dynamo-sglang-runtime:1.4.1-amd64
          name: main
          ports:
          - name: system
            containerPort: 8000
            protocol: TCP
          resources:
            limits:
              memory: 64Gi
              nvidia.com/gpu: '1'
            requests:
              cpu: '8'
              ephemeral-storage: 8Gi
              memory: 32Gi
              nvidia.com/gpu: '1'
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RESOURCE
          volumeMounts:
          - mountPath: /mnt/nfs-models/default
            name: model-storage
            readOnly: true
            subPath: default
          - mountPath: /dev/shm
            name: dshm
          workingDir: /workspace/examples/backends/sglang
        imagePullSecrets:
        - name: docker-registry-secret
        terminationGracePeriodSeconds: 300
        tolerations:
        - effect: NoSchedule
          key: node-role.alibabacloud.com/bmcp
          operator: Exists
        volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: nhi-dynamo-trace-models-pvc
        - emptyDir:
            medium: Memory
            sizeLimit: 64Gi
          name: dshm
    replicas: 1
    type: prefill
  - name: decode
    podTemplate:
      metadata:
        labels:
          app.kubernetes.io/component: decode
          app.kubernetes.io/name: dynamo-trace-demo-mixed
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: dros.zjlab.io/clusterEnv
                  operator: In
                  values:
                  - drosInCluster
                - key: dros.zjlab.io/spec
                  operator: In
                  values:
                  - GPU_Z2280_24GB
                - key: dros.zjlab.io/resourcepool
                  operator: DoesNotExist
                - key: dros.zjlab.io/reserve
                  operator: DoesNotExist
                - key: dros.zjlab.io/nodegroup
                  operator: DoesNotExist
        containers:
        - args:
          - --model-path
          - /mnt/nfs-models/default/Qwen/Qwen2.5-7B-Instruct
          - --served-model-name
          - Qwen2.5-7B-Instruct
          - --context-length
          - '32768'
          - --page-size
          - '1'
          - --tp
          - '1'
          - --trust-remote-code
          - --chunked-prefill-size
          - '2048'
          - --mem-fraction-static
          - '0.85'
          - --host
          - 0.0.0.0
          - --enable-metrics
          - --kv-events-config
          - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5557"}'
          - --disaggregation-mode
          - decode
          - --disaggregation-transfer-backend
          - mooncake_tcp
          - --enable-trace
          - --otlp-traces-endpoint
          - otel-collector.nhi.svc.cluster.local:4317
          - --sglang-trace-level
          - '2'
          - --namespace
          - nhi-dynamo-trace-demo-mixed-pd
          command:
          - python3
          - -m
          - dynamo.sglang
          env:
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: DYN_EVENT_PLANE
            value: zmq
          - name: DYN_WORKER_GRACEFUL_SHUTDOWN_TIMEOUT
            value: '300'
          # 覆盖 operator 默认注入的 DYN_SYSTEM_PORT=9090
          - name: DYN_SYSTEM_PORT
            value: '8000'
          - name: NCCL_DEBUG
            value: WARN
          - name: OTEL_EXPORT_ENABLED
            value: 'true'
          - name: OTEL_EXPORTER_OTLP_PROTOCOL
            value: grpc
          - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
            value: http://otel-collector.nhi.svc.cluster.local:4317
          - name: OTEL_SERVICE_NAME
            value: dynamo-trace-demo-mixed-decode
          - name: OTEL_TRACES_SAMPLE_RATIO
            value: '1.0'
          image: 10.200.88.53/nhss/dynamo-sglang-runtime:1.4.1-amd64
          name: main
          ports:
          - name: system
            containerPort: 8000
            protocol: TCP
          resources:
            limits:
              memory: 64Gi
              nvidia.com/gpu: '1'
            requests:
              cpu: '8'
              ephemeral-storage: 8Gi
              memory: 32Gi
              nvidia.com/gpu: '1'
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RESOURCE
          volumeMounts:
          - mountPath: /mnt/nfs-models/default
            name: model-storage
            readOnly: true
            subPath: default
          - mountPath: /dev/shm
            name: dshm
          workingDir: /workspace/examples/backends/sglang
        imagePullSecrets:
        - name: docker-registry-secret
        terminationGracePeriodSeconds: 300
        tolerations:
        - effect: NoSchedule
          key: node-role.alibabacloud.com/bmcp
          operator: Exists
        volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: nhi-dynamo-trace-models-pvc
        - emptyDir:
            medium: Memory
            sizeLimit: 64Gi
          name: dshm
    replicas: 1
    type: decode
