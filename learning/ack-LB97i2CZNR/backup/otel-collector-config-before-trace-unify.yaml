apiVersion: v1
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318          # ← 新增: NCCL Inspector 推 OTLP metrics 用

    processors:
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        pod_association:
          - sources:
              - from: connection
        extract:
          metadata:
            - k8s.pod.name
            - k8s.namespace.name
            - k8s.node.name
            - k8s.deployment.name
          labels:
            - tag_name: app.name
              key: app
              from: pod
            - tag_name: jobname
              key: dros.zjlab.io/jobname
              from: pod

      batch:
        timeout: 5s
        send_batch_size: 1024

      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128

    exporters:
      # --- 现有 traces 出口 (不动) ---
      otlp/vector:
        endpoint: nhi-vector-agg-traces.nhi.svc.cluster.local:4317
        tls:
          insecure: true

      kafka:
        brokers:
          - "10.107.159.7:9092"
          - "10.107.159.8:9092"
          - "10.107.159.9:9092"
          - "10.107.159.10:9092"
        protocol_version: "3.0.0"
        timeout: 5s
        topic: llm-trace-dev
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 1000

      # --- 新增 metrics 出口: 直推 aggr remote-write 入口 ---
      prometheusremotewrite/prom:
        endpoint: http://nhi-vector-agg-metrics.nhi.svc:6004/api/v1/write
        resource_to_telemetry_conversion:
          enabled: true                     # 将 OTEL_RESOURCE_ATTRIBUTES → metric label

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlp/vector, kafka]
        # --- 新增 metrics 管线: 不启用 k8sattributes (避免额外开销) ---
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheusremotewrite/prom]
      telemetry:
        logs:
          level: info
